# Separate disposable synthetic database. Does not change the deployed demo Compose file.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: seva_test
      POSTGRES_PASSWORD: synthetic_local_only
      POSTGRES_DB: seva_phase1_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seva_test -d seva_phase1_test"]
      interval: 2s
      timeout: 3s
      retries: 30
