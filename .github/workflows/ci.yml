name: AirshedOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python scripts/export_openapi.py && git diff --exit-code -- openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- src/lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/scan_secrets.py
  browser:
    runs-on: ubuntu-latest
    # No credentials are supplied. Synthetic routes test satellite observations;
    # unconfigured real endpoints return immediately without initializing Earth Engine.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d --wait
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose down
