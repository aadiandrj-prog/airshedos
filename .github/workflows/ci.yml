name: AirshedOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: seva_test
          POSTGRES_PASSWORD: synthetic_local_only
          POSTGRES_DB: seva_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seva_test -d seva_phase1_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://seva_test:synthetic_local_only@127.0.0.1:5432/seva_phase1_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.lock
            apps/api/requirements-dataset.lock
            apps/api/requirements-model.lock
      - run: pip install -r requirements-dev.lock -r requirements-model.lock
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          SEVA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run test:identity
        working-directory: apps/web
        env:
          SEVA_TEST_PYTHON: python
      - name: Select reachable signed Ubuntu archive for browser dependencies
        run: sudo env GITHUB_ACTIONS=true python3 ../../scripts/ci_browser_packages.py
      - run: npx playwright install --with-deps chromium && npm run test:resident && npm run test:authority && npm run test:pilot
        working-directory: apps/web
        env:
          SEVA_TEST_PYTHON: python
      - run: python scripts/export_openapi.py && git diff --exit-code -- openapi.json ../../docs/contracts/pollution_event_v1.schema.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- src/lib/api-schema.d.ts
      - run: npm run test:plume
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/scan_secrets.py
  browser:
    runs-on: ubuntu-latest
    # No credentials are supplied. Synthetic routes test forecast, satellite and Gemini output;
    # unconfigured endpoints return without initializing either cloud provider.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Select reachable signed Ubuntu archive for browser dependencies
        run: sudo env GITHUB_ACTIONS=true python3 scripts/ci_browser_packages.py
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d --wait
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose down
