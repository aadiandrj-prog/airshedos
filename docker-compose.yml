services:
  api:
    build: ./apps/api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      EARTH_ENGINE_PROJECT: ${EARTH_ENGINE_PROJECT:-${GOOGLE_CLOUD_PROJECT:-}}
      SATELLITE_LOOKBACK_HOURS: ${SATELLITE_LOOKBACK_HOURS:-72}
      SATELLITE_RADIUS_KM: ${SATELLITE_RADIUS_KM:-10}
      SATELLITE_CACHE_TTL_SECONDS: ${SATELLITE_CACHE_TTL_SECONDS:-3600}
      SATELLITE_TIMEOUT_SECONDS: ${SATELLITE_TIMEOUT_SECONDS:-25}
      CORROBORATION_REPORT_TTL_SECONDS: ${CORROBORATION_REPORT_TTL_SECONDS:-1800}
      CORROBORATION_REPORT_MAX_ENTRIES: ${CORROBORATION_REPORT_MAX_ENTRIES:-256}
      CORROBORATION_AQ_MAX_AGE_HOURS: ${CORROBORATION_AQ_MAX_AGE_HOURS:-2}
      CORROBORATION_WEATHER_MAX_AGE_HOURS: ${CORROBORATION_WEATHER_MAX_AGE_HOURS:-1}
      CORROBORATION_FIRES_MAX_AGE_HOURS: ${CORROBORATION_FIRES_MAX_AGE_HOURS:-24}
      CORROBORATION_FIRES_STRONG_AGE_HOURS: ${CORROBORATION_FIRES_STRONG_AGE_HOURS:-6}
      CORROBORATION_SATELLITE_MAX_AGE_HOURS: ${CORROBORATION_SATELLITE_MAX_AGE_HOURS:-24}
      CORROBORATION_FIRE_VERY_NEAR_KM: ${CORROBORATION_FIRE_VERY_NEAR_KM:-5}
      CORROBORATION_FIRE_NEAR_KM: ${CORROBORATION_FIRE_NEAR_KM:-15}
      CORROBORATION_FIRE_REGIONAL_KM: ${CORROBORATION_FIRE_REGIONAL_KM:-25}
      CORROBORATION_WIND_TOLERANCE_DEGREES: ${CORROBORATION_WIND_TOLERANCE_DEGREES:-45}
      CORROBORATION_WIND_MIN_SPEED_MPS: ${CORROBORATION_WIND_MIN_SPEED_MPS:-1}
      CORROBORATION_WIND_FIRE_MAX_TIME_GAP_HOURS: ${CORROBORATION_WIND_FIRE_MAX_TIME_GAP_HOURS:-1}
      CORROBORATION_FUTURE_TOLERANCE_SECONDS: ${CORROBORATION_FUTURE_TOLERANCE_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GOOGLE_MAPS_PLATFORM_API_KEY: ${GOOGLE_MAPS_PLATFORM_API_KEY:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      ENVIRONMENT_HTTP_TIMEOUT_SECONDS: ${ENVIRONMENT_HTTP_TIMEOUT_SECONDS:-8}
      ENVIRONMENT_CACHE_TTL_SECONDS: ${ENVIRONMENT_CACHE_TTL_SECONDS:-600}
      FORECAST_CACHE_TTL_SECONDS: ${FORECAST_CACHE_TTL_SECONDS:-900}
      FIRMS_CACHE_TTL_SECONDS: ${FIRMS_CACHE_TTL_SECONDS:-900}
      FIRMS_DATASET: ${FIRMS_DATASET:-VIIRS_NOAA20_NRT}
      FIRMS_SEARCH_RADIUS_KM: ${FIRMS_SEARCH_RADIUS_KM:-25}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
